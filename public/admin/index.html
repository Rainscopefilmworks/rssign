<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rainscope Sign Admin</title>
    <link rel="stylesheet" href="/admin/style.css" />
  </head>
  <body>
    <main class="admin">
      <header class="admin-header">
        <img src="/assets/logo.svg" alt="Rainscope" />
        <div>
          <p class="eyebrow">Backup controls</p>
          <h1>Open Sign Admin</h1>
          <p class="lede">Local control panel for the kiosk when Discord isn't available.</p>
        </div>
      </header>

      <div class="accent-line" aria-hidden="true"></div>

      <section class="card">
        <h2>Access</h2>
        <p class="card-note">Saved in this browser only.</p>
        <label for="password">Admin password</label>
        <div class="row">
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password" />
          <button id="save-password" class="btn" type="button">Save password</button>
        </div>
      </section>

      <section class="card">
        <h2>Sign status</h2>
        <div id="status-panel" class="status-panel">
          <p id="status-badge" class="status-badge">Loading</p>
          <dl id="status-details" class="status-details"></dl>
        </div>

        <div class="actions">
          <button class="btn btn-open" data-override="open" type="button">Set open</button>
          <button class="btn btn-closed" data-override="closed" type="button">Set closed</button>
          <button class="btn btn-secondary" id="auto" type="button">Return to schedule</button>
        </div>

        <form id="message-form" class="stack">
          <label for="message">Custom closed message</label>
          <div class="row">
            <input id="message" maxlength="120" placeholder="e.g. Back at 2pm" />
            <button class="btn" type="submit">Set message</button>
          </div>
        </form>

        <form id="back-in-form" class="stack">
          <label for="back-in-time">Back-in time</label>
          <div class="row">
            <input id="back-in-time" maxlength="30" placeholder="2:30 PM, 30 minutes, or 2 hours" />
            <button class="btn" type="submit">Set back-in</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Weekly hours</h2>
        <div id="hours" class="hours-grid"></div>
        <form id="hours-form" class="hours-form">
          <label for="day">Day</label>
          <select id="day">
            <option value="monday">Monday</option>
            <option value="tuesday">Tuesday</option>
            <option value="wednesday">Wednesday</option>
            <option value="thursday">Thursday</option>
            <option value="friday">Friday</option>
            <option value="saturday">Saturday</option>
            <option value="sunday">Sunday</option>
          </select>
          <label class="checkbox"><input id="is-open" type="checkbox" checked /> Open</label>
          <label for="open-time">Opens</label>
          <input id="open-time" type="time" value="09:00" />
          <label for="close-time">Closes</label>
          <input id="close-time" type="time" value="17:00" />
          <button class="btn" type="submit">Update day</button>
        </form>
      </section>

      <p id="notice" class="notice" role="status"></p>
    </main>
    <script src="/admin/app.js"></script>
  </body>
</html>
